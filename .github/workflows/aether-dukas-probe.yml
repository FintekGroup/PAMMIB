name: Aether Dukascopy M1 Probe

on:
  push:
    branches: [aether-native-r6]
    paths:
      - '.github/workflows/aether-dukas-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Dukascopy downloader
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/cpcerrato/dukascopy-downloader/releases/download/v0.1.4-beta.1/dukascopy-downloader-0.1.4-beta.1-linux-x64.tar.gz'
          curl -fL --retry 5 --retry-delay 2 "$url" -o /tmp/duka.tar.gz
          echo 'f9698ad4d01c1bb2afe41684062eb6c6adae3dcc40caa9fd490ef54a83d8af27  /tmp/duka.tar.gz' | sha256sum -c -
          mkdir -p /tmp/duka
          tar -xzf /tmp/duka.tar.gz -C /tmp/duka
          find /tmp/duka -maxdepth 3 -type f -print
          exe="$(find /tmp/duka -type f -name 'dukascopy-downloader' | head -1)"
          test -n "$exe"
          chmod +x "$exe"
          echo "DUKA_EXE=$exe" >> "$GITHUB_ENV"
          "$exe" --version
      - name: Download EURUSD January 2024 native M1 BID and ASK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf aether-r6/data-probe
          mkdir -p aether-r6/data-probe/out aether-r6/data-probe/cache
          "$DUKA_EXE" \
            --instrument EURUSD \
            --from 2024-01-01 --to 2024-02-01 \
            --timeframe m1 \
            --side both \
            --timezone UTC \
            --cache-root aether-r6/data-probe/cache \
            --output aether-r6/data-probe/out \
            --concurrency 8 \
            --max-retries 5 \
            --retry-delay 2s \
            --verbose 2>&1 | tee aether-r6/data-probe/download.log
          find aether-r6/data-probe/out -type f -maxdepth 2 -print -exec wc -l {} \;
          find aether-r6/data-probe/out -type f -maxdepth 2 -exec sha256sum {} \; > aether-r6/data-probe/SHA256SUMS.txt
          du -sh aether-r6/data-probe/out
      - name: Upload probe outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aether-r6-dukas-probe-${{ github.sha }}
          path: |
            aether-r6/data-probe/out/**
            aether-r6/data-probe/download.log
            aether-r6/data-probe/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30
