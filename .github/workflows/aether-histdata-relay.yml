name: Aether HistData Relay
on:
  push:
    branches:
      - aether-histdata-relay-20261002
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-m1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Fetch downloader
        run: git clone --depth 1 https://github.com/rpitchumani/histdata.git histdata-relay

      - name: Create bounded Aether config
        shell: bash
        run: |
          cat > relay-config.yaml <<'YAML'
          data_root: "../aether_histdata"
          subdirs:
            m1: m1
            tick: ticks
          end:
            year: 2025
            month: 12
          request_delay_seconds: 0.75
          pairs:
            - { code: eurusd, name: "EUR/USD", first: 201901 }
            - { code: usdcad, name: "USD/CAD", first: 201901 }
            - { code: audusd, name: "AUD/USD", first: 201901 }
          YAML

      - name: Download 2019-2025 M1
        working-directory: histdata-relay
        run: |
          uv sync
          uv run histdata-dl --config ../relay-config.yaml --timeframe m1 --pairs eurusd,usdcad,audusd --verbose

      - name: Build provenance inventory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          root=Path("aether_histdata")
          rows=[]
          for p in sorted(root.rglob("*.zip")):
              b=p.read_bytes()
              z_ok=False
              members=[]
              try:
                  with zipfile.ZipFile(p) as z:
                      bad=z.testzip()
                      z_ok=bad is None
                      members=z.namelist()
              except Exception:
                  pass
              rows.append({
                  "path":p.as_posix(),
                  "bytes":len(b),
                  "sha256":hashlib.sha256(b).hexdigest(),
                  "zip_integrity":z_ok,
                  "members":members,
              })
          Path("AETHER_HISTDATA_2019_2025_INVENTORY.json").write_text(json.dumps({
              "source":"histdata.com via rpitchumani/histdata",
              "classification":"historical M1 bid OHLC; EST without DST; not tick data",
              "range":"2019-2025",
              "pairs":["EURUSD","USDCAD","AUDUSD"],
              "files":rows
          },indent=2))
          assert len(rows)==21, f"expected 21 annual archives, got {len(rows)}"
          assert all(r["zip_integrity"] for r in rows)
          PY

      - name: Upload Aether data artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-histdata-m1-2019-2025
          path: |
            aether_histdata/
            AETHER_HISTDATA_2019_2025_INVENTORY.json
          compression-level: 0
          retention-days: 7
