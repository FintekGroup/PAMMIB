name: Public FX history retrieval
on:
  push:
    paths:
      - '.github/workflows/public-fx-history.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download public price history only
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p public-history
          npm install --ignore-scripts --no-audit --no-fund dukascopy-node@1.50.0 > public-history/npm-install.log 2>&1
          npm_status=$?
          printf 'npm_install_exit_code=%s\n' "$npm_status" > public-history/download-status.txt
          if [ "$npm_status" -eq 0 ]; then
            for tf in d1 h1; do
              for sym in eurusd usdcad audusd; do
                for side in bid ask; do
                  label="${sym}_${tf}_${side}_2005_2025"
                  timeout 70s ./node_modules/.bin/dukascopy-node -i "$sym" -from 2005-01-01 -to 2026-01-01 -t "$tf" -p "$side" -f csv -df iso -v -bs 20 -bp 300 -r 1 -rp 1000 -dir public-history -fn "$label" > "public-history/${label}.log" 2>&1
                  status=$?
                  printf '%s exit_code=%s\n' "$label" "$status" >> public-history/download-status.txt
                done
              done
            done
          fi
          python3 - <<'PY'
          import urllib.request,pathlib,json,hashlib,datetime
          root=pathlib.Path('public-history')
          receipt={'kind':'PUBLIC_MARKET_DATA_RETRIEVAL_ONLY','generated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'downloader':'dukascopy-node@1.50.0','requested_start':'2005-01-01','requested_end_exclusive':'2026-01-01','symbols':['EURUSD','USDCAD','AUDUSD'],'timeframes':['d1','h1'],'price_sides':['bid','ask'],'strategy_code_included':False,'broker_account_accessed':False,'files':[]}
          url='https://www.ecb.europa.eu/stats/eurofxref/eurofxref-hist.zip'
          try:
              with urllib.request.urlopen(url,timeout=30) as r:
                  raw=r.read(10000000)
              (root/'ecb_reference_history_NOT_EXECUTION_QUOTES.zip').write_bytes(raw)
              receipt['ecb_reference_backup']={'url':url,'bytes':len(raw),'not_bid_ask_or_trade_ticks':True}
          except Exception as e:
              receipt['ecb_reference_backup']={'url':url,'error':str(e)}
          for p in sorted(root.glob('*')):
              if p.is_file():
                  raw=p.read_bytes(); item={'file':p.name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
                  if p.suffix=='.csv':
                      lines=raw.decode('utf-8-sig').splitlines();item.update(rows=max(0,len(lines)-1),header=lines[0] if lines else '',first=lines[1] if len(lines)>1 else '',last=lines[-1] if len(lines)>1 else '')
                  receipt['files'].append(item)
          (root/'retrieval_receipt.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt,indent=2))
          PY
      - name: Retain public data and retrieval receipts for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-fx-history-2005-2025
          path: public-history/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
